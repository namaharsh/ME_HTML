<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Html</title>
</head>
<body>
      <!-- block level elements  -->
    <div>Hello </div>
    <div>world</div>
    <!-- inline level elements -->

    <a href="http://www.google.com">google</a>
    <a href="#">other</a>
    <hr>
    
    <span>mechanical</span>
    <br>
    <span>Engineering</span>
    <b>Hello</b>
    <center><i>world</i></center>
    
    <img src="./img.jpg" alt="error in loading">

    <font color="#0000ff">hello</font>
    <u>world</u>

    <p>Hello 
        world
        ABES
    </p>

    <pre>Hello
        world
        ABES
    </pre>

    <em>HELLO</em>

    <strike>Hello</strike>
    <ins>hello</ins>

    <p>H <sub>2</sub>0</p>
    <p>x <sup>2</sup></p>

    
 
</body>
</html>
